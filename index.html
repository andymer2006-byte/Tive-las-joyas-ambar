o2:{s:'o',p:'t',sp:'T',t:'El vigilante vio a un tipo con un cinco tatuado en el cuello. En la caja fuerte, un pelo largo y castaño... y una gorra olvidada. Cinco, pelo largo, gorra. No hace falta ser detective. Solo hace falta que no sea verdad.',ch:[['Ir a El Cuervo, donde bebe Five','bar1']]},
bar1:{s:'b',p:'f',sp:'F',t:'Vaya, el sabueso. Con ese sombrero pareces un cuervo en un funeral. ¿Vienes a sermonearme, hermanito?',ch:[['Agarrarlo del cuello: "¿Dónde están las joyas?"','b2a',{l:-1}],['Invitarle a un whisky y hablar como hermanos','b2b',{l:1}],['Cachearlo con disimulo mientras brindan','b2c',{c:1,l:-1}]]},
b2a:{s:'b',p:'f',sp:'F',t:'¡Suéltame! Yo no planeé nada. Fue Quintana, el de la gorra. Yo solo vigilé la puerta... ¡lo juro por mamá!',ch:[['"Mamá no te creería. Sigue hablando."','bar3',{c:1}]]},
b2b:{s:'b',p:'f',sp:'F',t:'Eres el único que me trata como a una persona, Tive. Mira... Quintana dijo que las joyas eran suyas por herencia. Yo solo vigilé la puerta. No sabía que era un robo.',ch:[['Apretarle el hombro: "Te creo. Sigue."','bar3',{c:1,l:1}]]},
b2c:{s:'b',p:'f',sp:'T',t:'Entre su mechero y un paquete arrugado encuentro una cerilla: "Almacén 9 · Muelle Norte". Five carraspea. Sabe que lo sé.',ch:[['Guardarla en el bolsillo sin decir nada','bar3',{c:1}]]},
bar3:{s:'b',p:'f',sp:'F',t:'Quintana se ve esta noche en el muelle. Ten cuidado: John no discute con palabras.',ch:[['Ir solo al muelle','dock1'],['"Vienes conmigo. Quiero que lo mires a los ojos."','dock1',{l:1,f:1}]]},
dock1:{s:'d',p:'j',ff:1,sp:'J',t:'Tive. Siempre con ese sombrero. ¿Sabes qué les pasa a los detectives que husmean de noche en el muelle? Los peces no hacen preguntas.',ch:[['Farolear: "Tengo testigos y pruebas, Quintana."',s=>s.c>=2?'dock2':'dock3'],['Enseñarle la cerilla del Almacén 9','dock2',{c:1},s=>s.c>=2],['Callar y dar una calada larga','dock4']]},
dock2:{s:'d',p:'j',ff:1,sp:'J',t:'Veo que sabes más de lo que debías. Está bien: el trabajo se hizo. Pero fue idea de tu hermano. Pregúntale por qué no te lo contó. Almacén 9. Termínalo tú.',ch:[['"Eso lo veremos allí."','w1',{c:1}]]},
dock3:{s:'d',p:'j',ff:1,sp:'J',t:'Testigos... ja. Ni tú te lo crees. Almacén 9, a medianoche. Ven si quieres respuestas.',ch:[['Aceptar la cita','w1']]},
dock4:{s:'d',p:'j',ff:1,sp:'J',t:'Fumas como quien reza. Me gusta eso. Ven al Almacén 9 y hablaremos como hombres.',ch:[['Seguirle en silencio','w1',{l:0}]]},
w1:{s:'w',p:'j',ff:1,sp:'J',t:'Mira el brillo, Tive. Cuatro millones en una maleta. Tu hermano la sujetaba con la misma mano con la que firma sus mentiras. ¿Y ahora? ¿Qué vas a hacer, detective?',ch:[['Acusar a John con lo que has descubierto',s=>s.c>=3?'end1':'end4'],['Acusar a Five delante de todos','end2'],['Proponer un trato: las joyas por tu silencio','end3'],['Desenfundar y apuntar a John',s=>s.f&&s.l>=1?'end5':'end6']]},
end1:{s:'e',sp:'X',t:'FINAL 1 de 12 · CASO CERRADO\n\nQuintana cantó entre esposas. Five salió con una condicional. La Duquesa pagó. Mi hermano no me dio las gracias: me invitó a un whisky. Esa noche la lluvia sonó casi a música.',end:1},
end2:{s:'e',sp:'X',t:'FINAL 2 de 12 · SANGRE DE MI SANGRE\n\nAcusé a Five. Quintana sonrió bajo la gorra y se perdió entre los contenedores. A mi hermano se lo llevó la policía con el cinco brillando bajo el foco. La ley quedó contenta. Yo no.',end:1},
end3:{s:'e',sp:'X',t:'FINAL 3 de 12 · EL PRECIO\n\nLas joyas cambiaron de manos. Hay trajes nuevos en mi armario y un nudo en el estómago. Ya no sé si el del espejo soy yo o una sombra que me alquila el sombrero.',end:1},
end4:{s:'e',sp:'X',t:'FINAL 4 de 12 · SIN PRUEBAS\n\nSin pruebas, mis palabras eran humo. Quintana rió, la maleta se evaporó y Five cargó con todo. Un detective sin pruebas es solo un hombre con sombrero.',end:1},
end5:{s:'e',sp:'X',t:'FINAL 5 de 12 · LUZ APAGADA\n\nFive tiró de la cadena de la lámpara. Oscuridad, un disparo, un grito. Cuando volvió la luz, John estaba en el suelo y mi hermano temblaba con mi arma. Cargamos juntos con lo que quedaba. Las joyas volvieron. Five también.',end:1},
end6:{s:'e',sp:'X',t:'FINAL 6 de 12 · ÚLTIMO CIGARRILLO\n\nFui lento. John no. El suelo frío, la lluvia en el techo, el último cigarrillo apagándose en mi mano. Lo último que oí fue a mi hermano diciendo mi nombre.',end:1}

ro1:{s:'o',p:'tr',sp:'R',t:'Una silueta con tacones apaga la luz del pasillo: Rose. Labios de tinta, abrigo abierto, perfume caro. —Cariño, la Duquesa Valmont me llamó antes que a ti. Dice que hay un segundo cheque si las joyas aparecen... y si aparece quien se las llevó. Yo solo vengo a ayudarte. Como siempre.',ch:[['Confiar en ella: \"Cuéntamelo todo, Rose.\"','ro2',{ro:1}],['Sospechar: \"¿Desde cuándo hablas con la Duquesa?\"','ro2',{ro:-1,c:1}]]},
ro2:{s:'o',p:'tr',sp:'R',t:'Tu lista es demasiado fácil: cinco, pelo largo, gorra. Hay un tercer nombre en el expediente de la Duquesa que nadie ha querido leerte. —Me acerca el papel con dos dedos—. Sterling. El coronel Vance Sterling.',ch:[['Se me hiela la sangre. Ese nombre no.','fl1',{i:'Nombre Sterling'}]]},
fl1:{s:'r',p:'tfv',sp:'V',t:FB+'Colina 112. Barro hasta las rodillas. El coronel Vance Sterling nos sonríe como quien reparte billetes: —Chicos, el puente es vuestro. Pasadlo y volveréis héroes. Five tiene diecinueve años y le tiembla el fusil. Yo le sujeto el hombro.',ch:[['Seguir recordando','fl2']]},
fl2:{s:'r',p:'tfv',sp:'N',t:FB+'El puente estaba minado. Lo supimos al pisarlo. Sterling había vendido nuestra ruta y se alejaba con la caja de pagos de la compañía. Murió medio batallón. Yo perdí un oído y la fe; Five, la voz durante tres meses y el resto después. Lo perdimos casi todo en el Año Rojo.',ch:[['Volver a la lluvia','tr1',{c:1,i:'Recuerdo del puente'}]]},
fv1:{s:'b',p:'f',sp:'F',t:'Quintana no manda, Tive. Trabaja para el mismo hombre que nos mandó al puente. Sterling está vivo. Es el dueño de Valmont & Hijos... y por eso McCoil rastrea tus pasos. Por eso la Duquesa pagó tanto: quería a alguien con ganas de venganza.',e:{c:1},ch:[['Apretar la mandíbula y salir hacia el muelle','cn1']]},
ro3:{s:'w',p:'tr',sp:'R',t:'Antes de entrar, una silueta sale de entre los contenedores y levanta una pistola con las dos manos. —Lo siento, cariño. Sterling me pagó la deuda de mi hermano. Y esta noche me pide que te lleve hasta él.',ch:[['Mirarla a los ojos: \"Baja el arma, Rose. Tú no eres ella.\"',s=>s.ro>=1?'ro4a':'ro4b'],['Enseñarle el recuerdo del puente: \"Sterling nos vendió, Rose.\"','ro4a',{ro:1}],['Desarmarla de un movimiento rápido','ro5']]},
ro5:{s:'w',p:'tr',sp:'N',t:'Te lanzas hacia su muñeca. Acierta con el tiempo o paga con sangre.',qte:{n:2,ok:'ro4a',ko:'ro4c'}},
ro4a:{s:'w',p:'tr',sp:'R',t:'Baja el arma despacio. —Nunca me dijo que el trabajo eras tú. Entremos, Tive. Se lo debo a tu hermano y se lo debo a tu sombrero.',e:{ro:1},ch:[['Entrar con ella a mi lado','w1']]},
ro4b:{s:'w',p:'tr',sp:'R',t:'No te creí cuando lo dije, y tú tampoco me creíste a mí. —El culatazo llega antes que la disculpa—. Perdona, cariño. Sterling espera dentro.',e:{h:-1,ro:-1},ch:[['Levantarte y entrar sangrando','w1']]},
ro4c:{s:'w',p:'tr',sp:'R',t:'El disparo te roza el hombro. Rose te mira con los ojos húmedos. —Qué estúpidos somos los dos. Entra. Él está esperando.',e:{h:-1},ch:[['Apretar la herida y entrar','w1']]},
st1:{s:'w',p:'tv',sp:'V',t:'Aplausos lentos desde la pasarela. —Cabo Tive. Dieciséis años y sigues oliendo a pólvora y a lealtad barata. Yo compré la guerra, hijo. Tú solo la sangraste.',ch:[['Recordar la última noche del Año Rojo','fl3',{c:1}],['Desenfundar contra Sterling','duel2'],['Callar, dar una calada y esperar a Rose',s=>s.ro>=2?'end11':'end10']]},
fl3:{s:'r',p:'tv',sp:'V',t:FB+'La última noche del Año Rojo. Sterling cuenta billetes con la caja entre las piernas mientras el puente arde. —Un héroe muerto es barato, cabo. Un héroe vivo pide pensión. —Me apunta. Five se abalanza; el disparo me roza la sien. Lo último que oigo es el pitido del oído roto y a mi hermano gritando que no me muera.',ch:[['Volver al almacén','st2']]},
st2:{s:'w',p:'tv',sp:'V',t:'—Qué conmovedor. No hay testigos, cabo. Nunca los hubo.',ch:[['Sacar las pruebas: foto, cerilla, recuerdo',s=>s.c>=3&&s.ro>=0?'end9':'end10'],['Mirar a Rose: \"Ahora.\"',s=>s.ro>=2?'end11':'end10']]},
duel2:{s:'w',p:'tv',sp:'N',t:'Sterling es viejo, pero no lento. Dispara cuando la barra esté en verde.',qte:{n:3,ok:'end9',ko:'end10'}},
end9:{s:'e',sp:'X',end:1,t:'FINAL 9 de 12 · AÑO ROJO, CUENTAS SALDADAS\n\nSterling salió esposado y sin medallas. Five declaró ante el tribunal con la voz que creía perdida. Rose me dejó un cigarrillo en la barra y se fue sin explicar nada. Tarde, pero el puente por fin cayó del lado correcto.'},
end10:{s:'e',sp:'X',end:1,t:'FINAL 10 de 12 · EL CORONEL SIGUE VIVO\n\nSterling se perdió en la niebla del muelle con una sonrisa y una maleta. La guerra terminó hace años; él nunca la dejó acabar. Rose dice que algún día volverá. Yo ya no sé a quién esperar.'},
end11:{s:'e',sp:'X',end:1,t:'FINAL 11 de 12 · LA ROSA Y LA BALA\n\nRose disparó primero. Sterling cayó de la pasarela con las medallas tintineando. Ella se desplomó despacio, con el abrigo abierto y la sonrisa torcida. —Esta vez no te mentí, cariño. Fumé su último cigarrillo en su honor.'}});

al1:{s:'b',p:'fs',sp:'S',t:'Escucha, Tive. Sterling me dejó sin pensión y sin aseguradora hace tres años. Eres el único idiota que lo odia más que yo. Alianza: yo pongo los contactos, tú las manos sucias.',ch:[['Estrecharle la mano: \"Trato hecho, McCoil.\"','tr2',{al:1,c:1,l:1}],['\"No necesito un perro de seguros.\"','tr2']]},
tr2:{s:'c',p:'tf',mv:1,sc:1.6,sp:'F',t:'Voy al volante del cacharro de Five, que huele a lluvia vieja. —¿Te acuerdas de cuando papá nos llevaba a ver los barcos? Knive lloró porque quería uno de verdad.',ch:[['\"¿Por qué sacas a Knive ahora?\"','car2']]},
car2:{s:'c',p:'tf',mv:1,sc:1.6,sp:'F',t:'Knive era el listo, Tive. Se parece tanto a ti que a veces dudo cuál de los dos soy. Dejó el ejército antes del Año Rojo y no volvió a escribir. Dicen que trabaja para gente de uniforme.',ch:[['Poner la radio y callar','car3',{l:1}],['\"Knive nos vendió en cuanto pudo.\"','car3']]},
car3:{s:'c',p:'tf',mv:1,sc:1.6,sp:'T',t:'La radio suelta un tango roto. Five mira por la ventanilla. —Si lo ves, no le hables. Te sonreirá con tu cara y te clavará con tu navaja. —Frenazo: un coche negro bloquea la carretera.',ch:[['Bajar del coche','cnk']]},
cnk:cn([[2800,'c','t','Un coche negro cierra la carretera.',{fx:'th'}],[3200,'c','tk','Un hombre baja con mi sombrero, mi gabardina y mi cara.',{fl:1}]],'kn1'),
kn1:{s:'c',p:'tk',sp:'K',t:'Hola, hermano. ¿Te gusta cómo me queda? El coronel me ofreció lo que ni tú ni Five podíais darme: ganar. Quintana es un payaso y tú, un detective con la suerte de un perro mojado. Entrégame las joyas y los dos vivís.',ch:[['\"Prefiero la lluvia a tu trato.\"','kn2'],['Ofrecerle un cigarrillo para ganar tiempo','kn2',{l:-1}]]},
kn2:{s:'c',p:'tk',sp:'N',t:'Knive saca una navaja gemela de la que yo guardo. Esquiva y contraataca cuando la barra marque el momento.',qte:{n:3,ok:'kn3',ko:'kn4'}},
kn3:{s:'c',p:'tk',sp:'K',t:'Le arranco el sombrero. Debajo, una cicatriz que yo no tengo. —Esto no acaba aquí, hermano. —Y se pierde en la niebla dejando su navaja en el charco.',e:{c:1,i:'Navaja de Knive'},ch:[['Recoger la navaja','m3']]},
kn4:{s:'c',p:'tk',sp:'K',t:'Un tajo en el abrigo y un golpe seco. Knive me quita el sombrero y se lo pone con aire de dueño. —Quédatelo, ya tengo otro. —Se va silbando mi propia canción.',e:{h:-1},ch:[['Levantarme con la ceja abierta','m3']]},
m3:{s:'c',p:'tm',sp:'M',t:'Un bastón golpea el adoquín. Me lo encuentro bajo la farola, empapado y sereno. —Chaval, Knive no es malo por naturaleza: es malo por contrato. Y todo contrato tiene una cláusula. Busca la suya, y cuando lo hagas, yo negociaré por ti.',e:{nm:1,c:1},ch:[['\"Gracias, maestro. Vamos al muelle.\"','cn5']]},
cn5:cn([[2600,'d','tf','Muelle Norte. La niebla huele a gasolina y a promesas.',{fx:'th'}],[2800,'d','tf','Una silueta tambaleante se acerca contando algo a las gaviotas.',{fl:1}]],'dock1'),
end12:{s:'e',sp:'X',end:1,t:'FINAL 12 de 12 · EL PACTO DE LOS TRES\n\nMcCoil entró por la claraboya con una orden de arresto y sonrisa de comisionista. El Negociante Negociado cerró el último trato de su vida: la rendición de Sterling a cambio de conservar su bastón. Knive huyó con mi sombrero, pero esa es otra historia. Five me abrazó. Rose dejó el cigarrillo encendido. Por una vez, llovió a favor.'}});

N.st1.ch.push(['Silbar: McCoil y El Negociante entran por el techo','end12',{},s=>s.al&&s.nm]);
Object.assign(N.dock1,{t:'¡Tive! Qué susto, pensé que eras mi sombrero. Es que mi sombrero también habla, ¿sabes? Me ha dicho que no te cuente nada del Almacén 9... ¡Uy! Se me escapó. ¿Quieres un caramelo? Son de regaliz. Creo.'});
N.dock2.t='Ah, la cerilla. Es del Almacén 9, sí. Yo solo cargaba maletas. Sterling me daba \"medicinas para el nervio\" y me quedaba dormido de pie. Si quieres acabar con esto, ven. Pero cuidado con el suelo, que se mueve.';
N.dock3.t='¿Testigos? Yo también tengo: los pájaros. Siempre me miran. Almacén 9, medianoche. Si no vengo, es que me dormí.';
N.dock4.t='Fumas como quien reza. Yo respiro como quien se olvida. ¿Dónde estaba? Ah, sí: Almacén 9. Hablemos como hombres. O como pájaros. Lo que salga.';
N.w1.t='Mira el brillo, Tive. Cuatro millones en una maleta. Tu hermano la sujetaba... o yo, no me acuerdo. ¿Y ahora? ¿Qué vas a hacer, detective? ...Perdona, me ha entrado la risa.';
N.ch1.t='John salta cajas, contenedores y, por algún motivo, una gaviota. El Almacén 9 está a cien metros. Salta cuando la barra marque el momento.';
N.ch2.t='Placaje limpio. John suelta su revólver, se disculpa y pregunta si es martes.';
N.duel.t='Los dos desenfundan. John saca un bocadillo por error, lo mira, lo tira y vuelve a empezar. ¡Dispara cuando la barra esté en verde!';
N.end5.t='FINAL 5 de 12 · LUZ APAGADA\n\nFive tiró de la cadena de la lámpara. Oscuridad, un disparo al techo, un grito de gaviota. Cuando volvió la luz, John dormía en el suelo, sano y salvo, y mi hermano temblaba con mi arma. Las joyas volvieron. Five también.';
N.end6.t='FINAL 6 de 12 · ÚLTIMO CIGARRILLO\n\nFui lento. Hasta John fue más rápido, y eso que se distrajo con una mariposa. El suelo frío, la lluvia en el techo, el último cigarrillo apagándose en mi mano. Lo último que oí fue a mi hermano diciendo mi nombre.';
N.end7.t='FINAL 7 de 12 · EL MEJOR DE LA CIUDAD\n\nGané el duelo. John cayó dormido con la gorra rodando por el suelo, sonriendo, y Spoil McCoil llegó tarde para llevarse el crédito, como siempre. Five bajó la mirada. Yo me quedé con la lluvia y el humo.';
N.help.t=N.help.t.replace('11 finales','12 finales');

c2_0:cn([[3200,'m','','Seis semanas después del caso Ámbar. La Ciudad Sombría tiene alcalde nuevo y miedo viejo.'],[3200,'h','c','Christor Carlinstein Crawford. Alcalde. Sonrisa de cirujano.',{fx:'th'}],[3200,'h','c','\"Entréguenme la ciudad o mi Huevo de Tiamat se la llevará.\"',{fl:1}]],'c2_1'),
c2_1:{s:'o',p:'tr',sp:'R',t:'Rose deja el periódico sobre la mesa. —El alcalde amenaza con destruir el mundo con una cosa llamada El Huevo de Tiamat. Cariño, te has puesto pálido.',ch:[['\"Conozco ese huevo. Lo vi en la guerra.\"','c2_2']]},
c2_2:{s:'r',p:'tv',sp:'V',t:'[FLASHBACK · GUERRA DEL AÑO ROJO]\nUn búnker bajo la Colina 112. El coronel Sterling, aún honesto, me enseña un huevo de acero del tamaño de un caballo. —Esto no se usa, cabo. Se entierra. Prométeme que si alguien lo despierta, lo harás callar.',ch:[['Volver a la lluvia','c2_3']]},
c2_3:{s:'o',p:'tm',sp:'M',t:'Un bastón golpea el suelo. —Chaval, un alcalde con un arma del fin del mundo es un mal contrato. Pero ninguno de nosotros ha ganado solo. Llama a los tuyos.',ch:[['Llamar a mis aliados','c2_4']]},
c2_4:cn([[2800,'b','tf','Five llega primero. Siempre llega primero cuando hay problemas.'],[2800,'b','tfs','Spoil McCoil entra con una carpeta y un paraguas: ya es parte del equipo.'],[2800,'d','tj','John Quintana aparece disfrazado de farola. Nadie sabe por qué.']],'c2_5'),
c2_5:{s:'d',p:'tj',sp:'J',t:'¡Tive! Soy una farola muy discreta. Escucha: Knive me dio caramelos para que le abriera la reja del ayuntamiento. Eran buenísimos, creo que eran de menta. O de sedante.',ch:[['\"Gracias, John. Eres un tesoro involuntario.\"','c2_6',{c:1}],['Quitarle el disfraz con suavidad','c2_6',{c:1,l:1}]]},
c2_6:{s:'c',p:'tf',mv:1,sc:1.6,sp:'F',t:'Vamos hacia el ayuntamiento en el cacharro de Five. —¿Y si Knive tiene razón? Que somos hermanos solo de nombre. Nunca he sabido por qué me parezco tanto a ti.',ch:[['\"Eres mi hermano. No lo olvides.\"','c2_7',{l:1}],['Callar y encender un cigarrillo','c2_7']]},
c2_7:{s:'c',p:'tf',mv:1,sc:1.6,sp:'F',t:'Christor se parece a alguien, Tive. Lo vi en el cartel de campaña: el mentón, la forma de mirar... Se parece a alguien que ya conocemos. —Frenazo: algo bloquea la carretera.',ch:[['Bajar del coche','c2_8']]},
c2_8:cn([[2800,'c','t','Un coche negro bloquea la carretera.',{fx:'th'}],[3200,'c','tk','Knive baja con mi sombrero, mi gabardina y mi cara.',{fl:1}]],'c2_9'),
c2_9:{s:'c',p:'tk',sp:'K',t:'Hermano. El Huevo despertará esta noche y tú vas a ver lo que eres de verdad. ¿Nunca te preguntaste por qué nuestro padre no sale en ninguna foto?',ch:[['Desenfundar la navaja','c2_10']]},
c2_10:{s:'c',p:'tk',sp:'N',t:'Knive embiste. Esquiva y contraataca cuando la barra marque el momento.',qte:{n:3,ok:'c2_11',ko:'c2_12'}},
c2_11:{s:'c',p:'tk',sp:'K',t:'Le arranco la navaja de la mano. —Qué torpe soy. Me dejo la tarjeta del ayuntamiento en el bolsillo... —Se ríe y se pierde en la niebla.',e:{c:1,i:'Tarjeta del ayuntamiento'},ch:[['Recoger la tarjeta','c2_13']]},
c2_12:{s:'c',p:'tk',sp:'K',t:'Un tajo en el abrigo y un golpe seco. —Sigues sin entenderlo —susurra Knive—. Nos vemos dentro.',e:{h:-1},ch:[['Levantarme y seguir','c2_13']]},
c2_13:{s:'o',p:'tr',sp:'R',t:'Rose despliega un papel quemado de la caja fuerte de Valmont. —Proyecto Génesis. Falta más de la mitad. Pero aparece tu nombre, cariño. Y el de Five, y el de Knive.',e:{c:1},ch:[['Guardarlo sin leerlo más','c2_14']]},
c2_14:{s:'b',p:'fs',sp:'S',t:'Plan, detective. El Negociante distrae al alcalde con un contrato imposible. Yo ordeno los papeles. John entretiene a los guardias... vestido de farola. Rose cubre la salida. Vosotros dos, al Huevo.',ch:[['\"Me gusta. Es una locura con papeleo.\"','c2_15',{l:1}],['\"Sin fallos, McCoil. Ni uno.\"','c2_15']]},
c2_15:cn([[2800,'c','tfs','Noche. Ayuntamiento de la Ciudad Sombría.',{fx:'th'}],[3000,'h','tc','Christor los esperaba, de espaldas, junto a un huevo de acero.',{fl:1}]],'c2_16'),
c2_16:{s:'h',p:'tc',sp:'C',t:'Detective Tive. Qué familiar me resulta usted. Quiero un mundo sin ruido, sin hermanos, sin guerras. El Huevo de Tiamat lo callará todo. Solo necesito su llave, y usted ya la lleva.',ch:[['\"Por encima de mi cadáver.\"','c2_17'],['\"Hablemos. Soy detective, no mártir.\"','c2_17',{l:-1}]]},
c2_17:{s:'h',p:'tc',sp:'N',t:'Los guardias cierran el cerco. Resiste el primer asalto cuando la barra marque el momento.',qte:{n:3,ok:'c2_18',ko:'c2_19'}},
c2_18:{s:'h',p:'tf',sp:'F',t:'Five rompe una lámpara en la cabeza de un guardia. —¡Sigue! ¡Yo me ocupo de estos!',ch:[['Avanzar hacia el Huevo','c2_20']]},
c2_19:{s:'h',p:'tf',sp:'F',t:'Un culatazo me sienta en el suelo. Five tira de mi abrigo. —Levántate, hermano. Hoy no.',e:{h:-1},ch:[['Levantarme','c2_20']]},
c2_20:{s:'h',p:'tk',sp:'K',t:'Te esperaba, hermano. ¿Te acuerdas de papá? Yo tampoco. Porque nunca tuve uno. Hoy el mundo conocerá a sus copias.',ch:[['Cargar contra Knive','c2_21']]},
c2_21:{s:'h',p:'tk',sp:'N',t:'Duelo de navajas bajo el Huevo. Esquiva y ataca cuando la barra marque el momento.',qte:{n:3,ok:'c2_23',ko:'c2_22'}},
c2_22:{s:'h',p:'tk',sp:'K',t:'Me abre una ceja. Cuando creo que es el final, una sombra detiene su brazo desde la penumbra.',e:{h:-1},ch:[['Mirar hacia la sombra','c2_23']]},
c2_23:{s:'h',p:'tv',sp:'V',t:'Hola, cabo. Cinco años escondido para esta noche. Me alegra verte tan entero. El Huevo no es un arma: es una forja. De ahí salieron Five, Knive y Christor. Los tres son tú, hijo. Tomé tu sangre en el puente.',ch:[['\"¿Qué has hecho, Sterling?\"','c2_24']]},
c2_24:{s:'h',p:'tv',sp:'V',t:'Five fue el obediente, Knive el defectuoso y Christor el perfecto: tu corazón con mi rostro. Todos mis hijos... y todos tus clones. ¿Nunca te preguntaste por qué Christor te recuerda tanto a mí?',ch:[['Mirar a Five','c2_25']]},
c2_25:{s:'h',p:'tf',sp:'F',t:'Entonces... no soy tu hermano. Soy una copia con la voz rota. —Se le quiebra el hombro entero.',ch:[['\"Eres mi hermano. Lo demás es papel y tubo.\"','c2_26',{l:1}],['Abrazarlo sin decir nada','c2_26',{l:1}]]},
c2_26:{s:'h',p:'tcm',sp:'M',t:'Christor activa el Huevo; un zumbido recorre la ciudad. El Negociante entra con el bastón. —Todo se negocia, hijo, menos la verdad: no eres Sterling, eres el hijo de lo que más odias. Piénsalo antes de apretar.',ch:[['Aprovechar su duda y lanzarte','c2_27']]},
c2_27:{s:'h',p:'tc',sp:'N',t:'Christor vacila. Corta los cables del Huevo cuando la barra marque el momento. ¡Cuatro cortes!',qte:{n:4,ok:'c2_28',ko:'c2_29'}},
c2_28:{s:'h',p:'tvs',sp:'S',t:'Los cables saltan en chispas y el Huevo se apaga. Spoil McCoil aparece con esposas. —Vance Sterling: fraude del siglo, falsificación de seres humanos e impago de seguro. Queda detenido.',ch:[['Mirar a Sterling','c2_30']]},
c2_29:{s:'h',p:'tc',sp:'N',t:'Una descarga te sacude. Cae un cable y Five lo aparta con el cuerpo. El Huevo se apaga justo a tiempo.',e:{h:-1},ch:[['Levantarme','c2_30']]},
c2_30:{s:'h',p:'tv',sp:'V',t:'Antes de que me lleven, cabo... Tú tampoco eres el original. Eres un clon mío, el primero y el mejor. Por eso me traicionaste: por eso me heredaste.',ch:[['Sostenerle la mirada','c2_31']]},
c2_31:{s:'h',p:'tr',sp:'R',t:'Me tiemblan las manos. Rose me las sostiene. —Cariño, mírame. Tive es quien fuma bajo la lluvia, quien se queda con su hermano, quien no acusa sin pruebas. Eso no sale de ningún tubo. Eres Tive. Eso basta.',ch:[['Encender un cigarrillo y sonreír','c2_32',{l:1}],['Besarla bajo el Huevo apagado','c2_32',{l:1}]]},
c2_32:cn([[3500,'k','tr','Un año después. El Año Rojo ya es historia. Llueve a favor.'],[3800,'k','trfsm','Rose y Tive se dan el \"sí\". Five, McCoil y el Negociante lloran sin admitirlo.'],[3500,'k','trfsm','Al fondo, John Quintana aplaude... al revés.']],'end13'),
end13:{s:'e',sp:'X',end:1,t:'FINAL · UNA BODA BAJO LA LLUVIA\n\nEl Huevo de Tiamat es chatarra y Sterling, un recuerdo. Christor, Knive y Five dejaron de ser copias el día en que escogieron quién ser. Tive no sabe quién lo creó, pero sabe quién lo quiere. Todo acaba bien.'}});
